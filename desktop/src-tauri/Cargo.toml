[package]
name = "scratchpad"
version = "1.0.0"
description = "Offline Scratchpad and Cellpad workspaces for macOS and Windows 11"
default-run = "scratchpad"
authors = ["Jeffrey Haines"]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
name = "scratchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
windows-policy = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.3.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }
webview2-com = "=0.38.2"

[[bin]]
name = "scratchpad-policy"
path = "src/bin/offline-policy.rs"
required-features = ["windows-policy"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSThread"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSCell"] }
